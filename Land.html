<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#62539f" />
    <title>lnCalculator</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        color: #202124;
        background: #fff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 100%;
        min-width: 0;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        background: #fff;
      }

      .app-bar {
        min-height: 48px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
        color: #fff;
        background: #62539f;
        box-shadow: 0 2px 4px rgb(0 0 0 / 18%);
      }

      .icon-button {
        display: grid;
        width: 28px;
        height: 36px;
        place-items: center;
        padding: 0;
        border: 0;
        color: inherit;
        background: transparent;
        cursor: pointer;
      }

      .app-title {
        flex: 1;
        font-size: 18px;
      }

      main {
        min-width: 0;
        width: min(100%, 520px);
        margin: 12px auto 0;
        padding:
          0
          max(14px, env(safe-area-inset-right))
          max(14px, env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
      }

      .calculator {
        position: relative;
        width: 100%;
        min-width: 0;
        min-height: 490px;
        min-height: min(490px, calc(100vh - 74px));
        min-height: min(490px, calc(100dvh - 74px));
        padding: 14px 12px 16px;
        border: 2px solid #292929;
        border-radius: 16px;
      }

      .page-label {
        position: absolute;
        top: -9px;
        left: 50%;
        padding: 0 8px;
        transform: translateX(-50%);
        color: #202124;
        background: #fff;
        font-size: 10px;
        white-space: nowrap;
      }

      .measure-section {
        position: relative;
        margin-bottom: 9px;
        padding: 6px;
        border: 2px solid #292929;
        border-radius: 12px;
      }

      .measure-section.type-hidden {
        display: none;
      }

      #circle-sections .measure-section {
        margin-top: 10px;
      }

      .measure-section.show-label {
        padding-top: 16px;
      }

      .measure-section-label {
        position: absolute;
        display: none;
        top: -8px;
        left: 10px;
        z-index: 1;
        padding: 0 5px;
        color: #202124;
        background: #fff;
        font-size: 10px;
        line-height: 14px;
      }

      .measure-section.show-label .measure-section-label {
        display: block;
      }

      .measure-row {
        display: grid;
        min-height: 42px;
        grid-template-columns: minmax(76px, 0.8fr) 36px minmax(0, 1fr) minmax(0, 1fr);
        align-items: center;
        gap: 5px;
      }

      .measure-row + .measure-row {
        margin-top: 2px;
      }

      .measure-label {
        text-align: center;
        font-size: 10px;
        white-space: nowrap;
      }

      .eye-toggle {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 0;
        color: #3e5eb0;
        background: transparent;
        cursor: pointer;
      }

      .eye-toggle svg {
        width: 20px;
        height: 20px;
      }

      .measurement-input {
        width: 100%;
        min-width: 0;
        height: 36px;
        padding: 4px 6px;
        border: 1.5px solid #4c50bb;
        border-radius: 8px;
        outline: none;
        font-size: 12px;
        text-align: center;
      }

      .measurement-input:focus,
      .result-input:focus {
        border-color: #303f9f;
        box-shadow: 0 0 0 2px rgb(76 80 187 / 15%);
      }

      .measure-row.is-hidden .measurement-input {
        display: none;
      }

      #triangle-sections .measure-section {
        margin-top: 10px;
      }

      #circle-sections .measure-section {
        margin-top: 10px;
      }

      .result-section {
        display: grid;
        gap: 9px;
        padding: 9px 6px 7px;
        border: 2px solid #292929;
        border-radius: 12px;
      }

      .law-box {
        position: relative;
        display: none;
        width: 100%;
        min-width: 0;
        margin-top: 12px;
        padding: 15px 10px 10px;
        border: 1px solid #b8b0f0;
        border-radius: 12px;
      }

      .law-box.is-visible {
        display: grid;
        gap: 6px;
      }

      .law-title {
        position: absolute;
        top: -7px;
        left: 50%;
        padding: 0 5px;
        transform: translateX(-50%);
        color: #202124;
        background: #fff;
        font-size: 12px;
        line-height: 14px;
      }

      .law-text {
        margin: 0;
        color: #202124;
        font-size: clamp(10px, 2.8vw, 12px);
        line-height: 1.5;
        text-align: center;
        overflow-wrap: anywhere;
      }

      .law-text.english {
        color: #52627d;
      }

      .result-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: center;
        gap: 6px;
      }

      .result-field {
        position: relative;
        min-width: 0;
      }

      .result-input {
        width: 100%;
        height: 39px;
        padding: 7px 5px 3px;
        border: 2px solid #4c50bb;
        border-radius: 12px;
        outline: none;
        font-size: 12px;
        text-align: center;
      }

      .result-label {
        position: absolute;
        top: -6px;
        left: 50%;
        padding: 0 5px;
        transform: translateX(-50%);
        color: #4c50bb;
        background: #fff;
        font-size: 10px;
        white-space: nowrap;
      }

      .result-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }

      .clear-button,
      .save-button {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 0;
        border-radius: 50%;
        color: #3e5eb0;
        background: #e8edff;
        cursor: pointer;
      }

      .clear-button svg,
      .save-button svg {
        width: 20px;
        height: 20px;
      }

      .type-group {
        position: relative;
        display: flex;
        width: 100%;
        min-width: 0;
        min-height: 0;
        align-items: center;
        justify-content: center;
        margin-top: 12px;
        margin-bottom: 10px;
        padding: 15px 4px 10px;
        border: 1px solid #b8b0f0;
        border-radius: 12px;
      }

      .client-group {
        width: 100%;
        min-width: 0;
        margin: 0 0 10px;
        padding: 0;
        border: 1px solid #b8b0f0;
        border-radius: 12px;
      }

      .client-toggle {
        display: flex;
        width: 100%;
        min-height: 34px;
        align-items: center;
        justify-content: space-between;
        padding: 5px 10px;
        border: 0;
        border-radius: inherit;
        color: #202124;
        background: transparent;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .client-toggle:focus-visible {
        outline: 2px solid #303f9f;
        outline-offset: 2px;
      }

      .client-fields {
        display: grid;
        min-width: 0;
        gap: 8px;
        padding: 2px 8px 9px;
      }

      .client-fields[hidden] {
        display: none;
      }

      .client-field {
        display: grid;
        min-width: 0;
        gap: 4px;
        color: #40347e;
        font-size: 11px;
      }

      .client-input {
        width: 100%;
        min-width: 0;
        min-height: 34px;
        padding: 6px 8px;
        border: 1px solid #b8b0f0;
        border-radius: 7px;
        font: inherit;
        font-size: 12px;
      }

      .client-code {
        min-height: 180px;
        resize: vertical;
        font-family: Consolas, "Courier New", monospace;
        font-size: 10px;
        line-height: 1.4;
        white-space: pre;
      }

      .save-status {
        display: none;
        padding: 0 8px 5px;
        color: #40347e;
        font-size: 10px;
        text-align: right;
      }

      .save-status:not(:empty) {
        display: block;
      }

      .type-label {
        position: absolute;
        top: -7px;
        left: 50%;
        padding: 0 5px;
        transform: translateX(-50%);
        color: #202124;
        background: #fff;
        font-size: 12px;
        line-height: 14px;
      }

      .type-buttons {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }

      .type-button {
        min-height: 25px;
        padding: 2px 6px;
        border: 1px solid #b8b0f0;
        border-radius: 4px;
        color: #202124;
        background: #fff;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .type-button[aria-pressed="true"] {
        border-color: #62539f;
        color: #40347e;
        background: #eeebfa;
      }

      .type-button:focus-visible,
      .clear-button:focus-visible,
      .save-button:focus-visible,
      .eye-toggle:focus-visible,
      .icon-button:focus-visible {
        outline: 2px solid #303f9f;
        outline-offset: 2px;
      }

      @media (max-height: 560px) {
        main {
          margin-top: 6px;
        }

        .calculator {
          min-height: 0;
          padding-top: 12px;
          padding-bottom: 12px;
        }
      }

      @media (max-width: 360px) {
        main {
          padding-inline: 8px;
        }

        .calculator {
          padding-inline: 8px;
        }

        .measure-section {
          padding: 4px;
        }

        .measure-row {
          grid-template-columns: minmax(68px, 0.7fr) 30px minmax(0, 1fr) minmax(0, 1fr);
          gap: 3px;
        }

        .eye-toggle {
          width: 30px;
        }

        .type-button {
          padding-inline: 4px;
          font-size: 11px;
        }
      }

      @media (max-width: 300px) {
        main {
          padding-inline: 4px;
        }

        .calculator {
          padding-inline: 5px;
        }

        .measure-section {
          padding: 3px;
        }

        .measure-row {
          grid-template-columns: minmax(58px, 0.65fr) 28px minmax(0, 1fr) minmax(0, 1fr);
          gap: 2px;
        }

        .measure-label {
          font-size: 9px;
        }

        .eye-toggle {
          width: 28px;
        }

        .measurement-input {
          padding-inline: 3px;
          font-size: 11px;
        }

        .result-row {
          gap: 4px;
        }

        .type-buttons {
          gap: 3px;
        }

        .type-button {
          padding-inline: 3px;
          font-size: 10px;
        }

        .clear-button,
        .save-button {
          width: 28px;
          height: 28px;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-bar">
      <button class="icon-button" type="button" aria-label="Back" onclick="history.back()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12H4m0 0 7-7m-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>
      <div class="app-title">lnCalculator</div>
      <button class="icon-button" type="button" aria-label="Clear all fields" id="toolbar-clear">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 5l14 14M19 5 5 19" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>
    </header>

    <main>
      <section class="calculator" aria-label="Land calculator">
        <div class="page-label">lnCalculator</div>
        <section class="client-group" id="client-group" aria-label="lnClient">
          <button
            class="client-toggle"
            id="client-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="client-fields"
          >
            <span>lnClient</span>
            <span id="client-toggle-icon" aria-hidden="true">+</span>
          </button>
          <div class="client-fields" id="client-fields" hidden>
            <label class="client-field">
              lnID
              <input class="client-input" id="lnID" type="text" autocomplete="off" />
            </label>
            <label class="client-field">
              lnTrack
              <input class="client-input" id="lnTrack" type="text" autocomplete="off" />
            </label>
            <label class="client-field">
              lnDetail
              <input class="client-input" id="lnDetail" type="text" autocomplete="off" />
            </label>
            <label class="client-field">
              lnMobile
              <input class="client-input" id="lnMobile" type="tel" autocomplete="off" />
            </label>
            <label class="client-field">
              lnCode
              <textarea class="client-input client-code" id="lnCode" spellcheck="false"></textarea>
            </label>
            <label class="client-field">
              GitHub token (Contents read/write; not saved)
              <input
                class="client-input"
                id="github-token"
                type="password"
                autocomplete="off"
                spellcheck="false"
              />
            </label>
          </div>
          <div class="save-status" id="save-status" role="status" aria-live="polite"></div>
        </section>
        <fieldset class="type-group">
          <legend class="type-label">lnType</legend>
          <div class="type-buttons" role="group" aria-label="Land type">
            <button class="type-button" type="button" aria-pressed="false">Rectangular</button>
            <button class="type-button" type="button" aria-pressed="false">Triangular</button>
            <button class="type-button" type="button" aria-pressed="false">Round</button>
          </div>
        </fieldset>

        <div id="measurement-sections"></div>
        <div id="triangle-sections"></div>
        <div id="circle-sections"></div>

        <section class="result-section" aria-label="Area results">
          <div class="result-row">
            <label class="result-field">
              <span class="result-label">SqFeet</span>
              <input class="result-input" id="sqfeet" inputmode="decimal" aria-label="SqFeet" />
            </label>
            <label class="result-field">
              <span class="result-label">SqMeter</span>
              <input class="result-input" id="sqmeter" inputmode="decimal" aria-label="SqMeter" />
            </label>
            <label class="result-field">
              <span class="result-label">SqYard</span>
              <input class="result-input" id="sqyard" inputmode="decimal" aria-label="SqYard" />
            </label>
          </div>
          <div class="result-row">
            <label class="result-field">
              <span class="result-label">Decimal</span>
              <input class="result-input" id="decimal" inputmode="decimal" aria-label="Decimal" />
            </label>
            <label class="result-field">
              <span class="result-label">Acre</span>
              <input class="result-input" id="acre" inputmode="decimal" aria-label="Acre" />
            </label>
            <div class="result-actions">
              <button class="clear-button" type="button" id="clear" aria-label="Clear all fields and hide all rows" title="Clear">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" />
                </svg>
              </button>
              <button class="save-button" type="button" id="save" aria-label="Save calculator and update GitHub LandList" title="Save">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 3h12l4 4v14H3V3h2zm2 0v6h10V3M7 21v-8h10v8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>
        </section>

        <section class="law-box" id="law-box" aria-labelledby="law-title" aria-live="polite">
          <span class="law-title" id="law-title">lnLaw</span>
          <p class="law-text" id="law-bengali"></p>
          <p class="law-text english" id="law-english"></p>
        </section>

      </section>
    </main>

    <script>
      const storageKey = "rre-land-calculator";
      const landListApiUrl =
        "https://api.github.com/repos/jakirfile/Source-Code/contents/RRE/Data/LandList";
      const landListHeader =
        "lnID,lnUser,lnTrack,tlnType,lnDate,lnSector,lnLengthFeet,lnLengthInch,lnWidthFeet,lnWidthInch,lnReceiver,lnPayer,lnMouja,lnKhatiyan,lnDag,lnRegiDate,lnRegiNo,lnNote";
      const pageSource = `<!doctype html>\n${document.documentElement.outerHTML}`;
      const clientFields = {
        enID: "",
        enTrack: "",
        lnDetail: "",
        lnMobile: "",
        lnCode: pageSource,
      };
      const sections = [
        {
          label: "lnOne",
          landTypes: ["Rectangular"],
          rows: ["Length (A)", "Length (B)", "Length (X)"],
        },
        {
          label: "lnTwo",
          landTypes: ["Rectangular"],
          rows: ["Width (C)", "Width (D)", "Width (Y)"],
        },
      ];
      const fields = Array.from({ length: 12 }, () => "");
      const visibleRows = Array.from({ length: 6 }, () => true);
      const triangleFields = Array.from({ length: 6 }, () => "");
      const triangleVisibleRows = Array.from({ length: 3 }, () => true);
      const circleFields = ["", ""];
      let circleVisible = true;
      const resultIds = ["sqfeet", "decimal", "sqyard", "acre", "sqmeter"];
      const resultIndex = { sqfeet: 12, decimal: 13, sqyard: 14, acre: 15, sqmeter: 16 };
      let areaIsTarget = false;
      let changingFromCode = false;
      let selectedLandType = "";
      const triangleDerivedSides = [false, false, false];
      let triangleEditingSide = null;
      let savedScrollY = 0;
      let scrollSaveTimer = null;

      if ("scrollRestoration" in history) history.scrollRestoration = "manual";

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey) || "null");
          if (!saved) return;
          if (saved.client && typeof saved.client === "object") {
            Object.keys(clientFields).forEach((key) => {
              if (typeof saved.client[key] === "string") {
                clientFields[key] = saved.client[key];
              }
            });
          }
          if (Number.isFinite(saved.scrollY) && saved.scrollY >= 0) {
            savedScrollY = saved.scrollY;
          }
          if (!Array.isArray(saved.fields) || saved.fields.length !== 12) return;
          saved.fields.forEach((value, index) => {
            fields[index] = String(value ?? "").slice(0, 100);
          });
          if (Array.isArray(saved.visibleRows) && saved.visibleRows.length === 6) {
            saved.visibleRows.forEach((value, index) => {
              visibleRows[index] = Boolean(value);
            });
          }
          if (Array.isArray(saved.triangleFields) && saved.triangleFields.length === 6) {
            saved.triangleFields.forEach((value, index) => {
              triangleFields[index] = String(value ?? "").slice(0, 100);
            });
          }
          if (Array.isArray(saved.triangleVisibleRows) && saved.triangleVisibleRows.length === 3) {
            saved.triangleVisibleRows.forEach((value, index) => {
              triangleVisibleRows[index] = Boolean(value);
            });
          }
          if (Array.isArray(saved.circleFields) && saved.circleFields.length === 2) {
            saved.circleFields.forEach((value, index) => {
              circleFields[index] = String(value ?? "").slice(0, 100);
            });
          }
          if (typeof saved.circleVisible === "boolean") circleVisible = saved.circleVisible;
          if (Array.isArray(saved.triangleDerivedSides) &&
              saved.triangleDerivedSides.length === 3) {
            saved.triangleDerivedSides.forEach((value, index) => {
              triangleDerivedSides[index] = Boolean(value);
            });
          } else if (Number.isInteger(saved.triangleSolvedSide) &&
              saved.triangleSolvedSide >= 0 && saved.triangleSolvedSide <= 2) {
            triangleDerivedSides[saved.triangleSolvedSide] = true;
          }
          resultIds.forEach((id) => {
            const value = saved.results?.[id];
            document.getElementById(id).value = String(value ?? "").slice(0, 100);
          });
          areaIsTarget = Boolean(saved.areaIsTarget);
          if (["Rectangular", "Triangular", "Round"].includes(saved.selectedLandType)) {
            selectedLandType = saved.selectedLandType;
          }
        } catch (error) {
          console.warn("Could not restore land calculator state.", error);
        }
      }

      function saveState() {
        clientFields.enID = document.getElementById("lnID").value;
        clientFields.enTrack = document.getElementById("lnTrack").value;
        clientFields.lnDetail = document.getElementById("lnDetail").value;
        clientFields.lnMobile = document.getElementById("lnMobile").value;
        clientFields.lnCode = document.getElementById("lnCode").value;
        const results = Object.fromEntries(
          resultIds.map((id) => [id, document.getElementById(id).value])
        );
        localStorage.setItem(
          storageKey,
          JSON.stringify({
            fields,
            visibleRows,
            triangleFields,
            triangleVisibleRows,
            circleFields,
            circleVisible,
            results,
            areaIsTarget,
            selectedLandType,
            triangleDerivedSides,
            scrollY: window.scrollY,
            client: clientFields,
          })
        );
      }

      function encodeBase64(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = "";
        const chunkSize = 0x8000;
        for (let offset = 0; offset < bytes.length; offset += chunkSize) {
          binary += String.fromCharCode(...bytes.subarray(offset, offset + chunkSize));
        }
        return btoa(binary);
      }

      function decodeBase64(encoded) {
        const binary = atob(encoded.replace(/\s/g, ""));
        const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      function inchesToFeetAndInches(inches) {
        if (inches === null || inches < 0) return ["", ""];
        const rounded = Math.round(inches * 100000) / 100000;
        return [
          fmt(Math.floor((rounded + 1e-10) / 12)),
          fmt(rounded % 12),
        ];
      }

      function landRecordDimensions() {
        if (selectedLandType === "Triangular") {
          return [armInches(0), armInches(1)];
        }
        if (selectedLandType === "Round") {
          return [circleDiameterInches(), null];
        }
        return [
          totalInches(4) ?? totalInches(0) ?? totalInches(2),
          totalInches(10) ?? totalInches(6) ?? totalInches(8),
        ];
      }

      function buildLandListRecord() {
        if (!selectedLandType) {
          throw new Error("Land type বেছে নিন।");
        }
        const now = new Date();
        const idInput = document.getElementById("lnID");
        if (!idInput.value.trim()) {
          const pad = (value, width = 2) => String(value).padStart(width, "0");
          idInput.value =
            `${pad(now.getFullYear() % 100)}${pad(now.getMonth() + 1)}` +
            `${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}` +
            `${pad(now.getSeconds())}${pad(now.getMilliseconds(), 4)}`;
        }

        const id = idInput.value.trim();
        const track = document.getElementById("lnTrack").value.trim();
        const detail = document.getElementById("lnDetail").value.trim();
        const mobile = document.getElementById("lnMobile").value.trim();

        const [lengthInches, widthInches] = landRecordDimensions();
        const [lengthFeet, lengthRemainder] = inchesToFeetAndInches(lengthInches);
        const [widthFeet, widthRemainder] = inchesToFeetAndInches(widthInches);
        const area = document.getElementById("sqfeet").value.trim();
        const noteParts = [];
        if (detail) noteParts.push(`Detail: ${detail}`);
        if (mobile) noteParts.push(`Mobile: ${mobile}`);
        if (selectedLandType === "Triangular") {
          const sideZ = armInches(2);
          if (sideZ !== null) {
            const [feet, inches] = inchesToFeetAndInches(sideZ);
            noteParts.push(`Arm Z: ${feet} ft ${inches} in`);
          }
        } else if (selectedLandType === "Round") {
          noteParts.push("Diameter");
        }
        if (area) noteParts.push(`Area: ${area} SqFeet`);

        const record = [
          id,
          "",
          track,
          selectedLandType,
          `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`,
          "",
          lengthFeet,
          lengthRemainder,
          widthFeet,
          widthRemainder,
          "",
          "",
          "",
          "",
          "",
          "",
          "",
          noteParts.join("; "),
        ];
        if (record.some((value) => /[,\r\n]/.test(value))) {
          throw new Error("LandList fields-এ কমা বা নতুন লাইন ব্যবহার করা যাবে না।");
        }
        return record;
      }

      async function saveLandRecordToGitHub() {
        saveState();
        const status = document.getElementById("save-status");
        const tokenInput = document.getElementById("github-token");
        let token = "";
        try {
          const record = buildLandListRecord();
          saveState();
          token = tokenInput.value.trim();
          if (!token) {
            const button = document.getElementById("client-toggle");
            if (button.getAttribute("aria-expanded") !== "true") button.click();
            status.textContent = "GitHub-এ Save করতে lnClient-এ Contents read/write token দিন।";
            tokenInput.focus();
            return;
          }

          status.textContent = "GitHub LandList পড়া হচ্ছে…";
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token.trim()}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const readResponse = await fetch(`${landListApiUrl}?ref=main`, {
            headers,
            cache: "no-store",
          });
          if (!readResponse.ok) {
            const detail = await readResponse.text();
            throw new Error(`LandList পড়া যায়নি (HTTP ${readResponse.status}). ${detail}`);
          }

          const file = await readResponse.json();
          const lines = decodeBase64(file.content).replace(/\r/g, "").split("\n");
          while (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();
          if (lines[0]?.trim() !== landListHeader) {
            throw new Error("LandList-এর CSV header App_Map-এর schema-র সঙ্গে মেলে না; ফাইল পরিবর্তন করা হয়নি।");
          }
          if (lines.slice(1).some((line) => line && line.split(",").length !== 18)) {
            throw new Error("LandList-এ ভুল কলামসংখ্যার রেকর্ড আছে; ফাইল পরিবর্তন করা হয়নি।");
          }

          const matchingIndices = lines.reduce((matches, line, index) => {
            if (index > 0 && line.split(",", 2)[0].trim() === record[0]) {
              matches.push(index);
            }
            return matches;
          }, []);
          if (matchingIndices.length > 1) {
            throw new Error(`lnID ${record[0]} একাধিকবার আছে; আপডেট করা হয়নি।`);
          }
          const isUpdate = matchingIndices.length === 1;
          if (isUpdate) {
            lines[matchingIndices[0]] = record.join(",");
          } else {
            lines.push(record.join(","));
          }

          status.textContent = "GitHub LandList আপডেট করা হচ্ছে…";
          const writeResponse = await fetch(landListApiUrl, {
            method: "PUT",
            headers: { ...headers, "Content-Type": "application/json" },
            body: JSON.stringify({
              message: `${isUpdate ? "Update" : "Add"} LandList record ${record[0]}`,
              content: encodeBase64(lines.join("\n")),
              sha: file.sha,
              branch: "main",
            }),
          });
          if (!writeResponse.ok) {
            const detail = await writeResponse.text();
            throw new Error(`GitHub Save ব্যর্থ (HTTP ${writeResponse.status}). ${detail}`);
          }

          status.textContent = `GitHub LandList-এ ${isUpdate ? "আপডেট" : "নতুন রেকর্ড"} সংরক্ষিত হয়েছে (${record[0]})।`;
        } catch (error) {
          console.error("Could not save land record to GitHub.", error);
          status.textContent =
            error instanceof Error
              ? `Save ব্যর্থ: ${error.message}`
              : "Save ব্যর্থ হয়েছে।";
        } finally {
          token = "";
          tokenInput.value = "";
        }
      }

      function fmt(value) {
        if (!Number.isFinite(value)) return "";
        return value.toFixed(5).replace(/\.?0+$/, "");
      }

      function numberOrNull(value) {
        if (value.trim() === "") return null;
        const number = Number(value);
        return Number.isFinite(number) ? number : null;
      }

      function setResult(id, value) {
        const input = document.getElementById(id);
        if (document.activeElement !== input || changingFromCode) {
          input.value = value;
        }
      }

      function totalInches(start) {
        const feet = numberOrNull(fields[start]);
        const inches = numberOrNull(fields[start + 1]);
        if (feet === null && inches === null) return null;
        if ((feet !== null && feet < 0) || (inches !== null && inches < 0)) return null;
        return (feet || 0) * 12 + (inches || 0);
      }

      function writeInches(start, inches) {
        const rounded = Math.round(inches * 100000) / 100000;
        fields[start] = fmt(Math.floor((rounded + 1e-10) / 12));
        fields[start + 1] = fmt(rounded % 12);
        [start, start + 1].forEach((index) => {
          const input = document.querySelector(`[data-field="${index}"]`);
          if (input) input.value = fields[index];
        });
      }

      function updateTotals(changedIndex) {
        if (changedIndex < 0) return;
        [[0, 2, 4], [6, 8, 10]].forEach(([first, second, total]) => {
          if (changedIndex < first || changedIndex > second + 1) return;
          if (changedIndex === total || changedIndex === total + 1) return;
          const a = totalInches(first);
          const b = totalInches(second);
          if (a !== null && b !== null) writeInches(total, a + b);
        });
      }

      function updateArea(changedIndex = -1) {
        if (selectedLandType === "Triangular") {
          updateTriangleArea(changedIndex);
          return;
        }
        if (selectedLandType === "Round") {
          updateRoundArea(changedIndex);
          return;
        }
        updateTotals(changedIndex);
        let length = totalInches(4);
        let width = totalInches(10);
        const sqFeetInput = document.getElementById("sqfeet");
        let squareFeet = numberOrNull(sqFeetInput.value);

        if (changedIndex >= 0) {
          [[4, 0, 2], [10, 6, 8]].forEach(([totalIndex, firstIndex, secondIndex]) => {
            const total = totalInches(totalIndex);
            const first = totalInches(firstIndex);
            const second = totalInches(secondIndex);
            if (total === null || (first === null) === (second === null)) return;
            const missingIndex = first === null ? firstIndex : secondIndex;
            const known = first === null ? second : first;
            if (total >= known) writeInches(missingIndex, total - known);
          });
          length = totalInches(4);
          width = totalInches(10);
        }

        if (areaIsTarget && squareFeet !== null && changedIndex >= 0) {
          let solveLength;
          if (changedIndex >= 10 && changedIndex <= 11) {
            solveLength = true;
          } else if (changedIndex >= 4 && changedIndex <= 5) {
            solveLength = false;
          } else if (changedIndex >= 12 && changedIndex <= 16) {
            solveLength = width !== null;
          } else if (length === null && width !== null) {
            solveLength = true;
          } else {
            solveLength = false;
          }
          const knownTotal = solveLength ? width : length;
          if (knownTotal !== null && knownTotal > 0) {
            const start = solveLength ? 4 : 10;
            const areaFactor = selectedLandType === "Triangular" ? 1152 : 576;
            writeInches(start, (squareFeet * areaFactor) / knownTotal);
            if (solveLength) length = totalInches(4);
            else width = totalInches(10);
          }
        }

        if (!areaIsTarget && changedIndex < 12) {
          const areaFactor = selectedLandType === "Triangular" ? 1152 : 576;
          squareFeet = length !== null && width !== null ? (length * width) / areaFactor : null;
          changingFromCode = true;
          setResult("sqfeet", squareFeet === null ? "" : fmt(squareFeet));
          changingFromCode = false;
        }
        squareFeet = numberOrNull(sqFeetInput.value);
        if (squareFeet === null || squareFeet < 0) {
          resultIds.forEach((id) => {
            if (id !== "sqfeet" && id !== document.activeElement?.id) setResult(id, "");
          });
          saveState();
          return;
        }

        const conversions = {
          decimal: squareFeet / 435.6,
          sqyard: squareFeet / 9,
          acre: squareFeet / 43560,
          sqmeter: squareFeet * 0.09290304,
        };
        changingFromCode = true;
        Object.entries(conversions).forEach(([id, value]) => {
          if (changedIndex !== resultIndex[id]) setResult(id, fmt(value));
        });
        changingFromCode = false;
        saveState();
      }

      function circleDiameterInches() {
        const feet = numberOrNull(circleFields[0]);
        const inches = numberOrNull(circleFields[1]);
        if (feet === null && inches === null) return null;
        if ((feet !== null && feet < 0) || (inches !== null && inches < 0)) return null;
        return (feet || 0) * 12 + (inches || 0);
      }

      function writeCircleDiameterInches(totalInches) {
        const rounded = Math.round(totalInches * 100000) / 100000;
        circleFields[0] = fmt(Math.floor((rounded + 1e-10) / 12));
        circleFields[1] = fmt(rounded % 12);
        [0, 1].forEach((index) => {
          const input = document.querySelector(`[data-circle-field="${index}"]`);
          if (input) input.value = circleFields[index];
        });
      }

      function updateRoundArea(changedIndex = -1) {
        const diameterWasEdited = changedIndex === 0 || changedIndex === 1;
        if (diameterWasEdited) areaIsTarget = false;

        const sqFeetInput = document.getElementById("sqfeet");
        let squareFeet = numberOrNull(sqFeetInput.value);
        let diameter = circleDiameterInches();

        if (areaIsTarget && squareFeet !== null && squareFeet >= 0 &&
            circleVisible && !diameterWasEdited) {
          writeCircleDiameterInches(Math.sqrt((squareFeet * 576) / Math.PI));
          diameter = circleDiameterInches();
        } else if (!areaIsTarget && diameterWasEdited) {
          squareFeet = diameter === null ? null : (Math.PI * diameter ** 2) / 576;
          changingFromCode = true;
          setResult("sqfeet", squareFeet === null ? "" : fmt(squareFeet));
          changingFromCode = false;
        } else if (!areaIsTarget && changedIndex < 12) {
          squareFeet = diameter === null ? null : (Math.PI * diameter ** 2) / 576;
          changingFromCode = true;
          setResult("sqfeet", squareFeet === null ? "" : fmt(squareFeet));
          changingFromCode = false;
        }

        squareFeet = numberOrNull(sqFeetInput.value);
        if (squareFeet === null || squareFeet < 0) {
          resultIds.forEach((id) => {
            if (id !== "sqfeet" && id !== document.activeElement?.id) setResult(id, "");
          });
          saveState();
          return;
        }

        const conversions = {
          decimal: squareFeet / 435.6,
          sqyard: squareFeet / 9,
          acre: squareFeet / 43560,
          sqmeter: squareFeet * 0.09290304,
        };
        changingFromCode = true;
        Object.entries(conversions).forEach(([id, value]) => {
          if (changedIndex !== resultIndex[id]) setResult(id, fmt(value));
        });
        changingFromCode = false;
        saveState();
      }

      function armInches(side) {
        const start = side * 2;
        const feet = numberOrNull(triangleFields[start]);
        const inches = numberOrNull(triangleFields[start + 1]);
        if (feet === null && inches === null) return null;
        if ((feet !== null && feet < 0) || (inches !== null && inches < 0)) return null;
        return (feet || 0) * 12 + (inches || 0);
      }

      function writeArmInches(side, inches) {
        const rounded = Math.round(inches * 100000) / 100000;
        const start = side * 2;
        triangleFields[start] = fmt(Math.floor((rounded + 1e-10) / 12));
        triangleFields[start + 1] = fmt(rounded % 12);
        [start, start + 1].forEach((index) => {
          const input = document.querySelector(`[data-arm-field="${index}"]`);
          if (input) input.value = triangleFields[index];
        });
      }

      function updateTriangleArea(changedIndex = -1) {
        const changedSide = changedIndex >= 0 && changedIndex < 6
          ? Math.floor(changedIndex / 2)
          : -1;
        if (changedSide >= 0) {
          triangleDerivedSides.forEach((isDerived, side) => {
            if (isDerived && side !== changedSide) {
              triangleFields[side * 2] = "";
              triangleFields[side * 2 + 1] = "";
            }
            triangleDerivedSides[side] = false;
          });
        }

        let arms = [armInches(0), armInches(1), armInches(2)];
        const sqFeetInput = document.getElementById("sqfeet");
        let squareFeet = numberOrNull(sqFeetInput.value);
        if (areaIsTarget && squareFeet !== null && squareFeet >= 0) {
          let legToSolve = null;
          if (changedSide === 0 && arms[0] !== null) legToSolve = 1;
          else if (changedSide === 1 && arms[1] !== null) legToSolve = 0;
          else if (arms[0] !== null) legToSolve = 1;
          else if (arms[1] !== null) legToSolve = 0;
          if (legToSolve !== null) {
            const knownLeg = arms[1 - legToSolve];
            if (knownLeg > 0 && legToSolve !== triangleEditingSide) {
              if (triangleVisibleRows[legToSolve]) {
                writeArmInches(legToSolve, (squareFeet * 288) / knownLeg);
                arms[legToSolve] = armInches(legToSolve);
                triangleDerivedSides[legToSolve] = true;
              }
            }
          }
        }

        const knownSides = arms
          .map((value, index) => value === null ? -1 : index)
          .filter((index) => index >= 0);
        if (knownSides.length === 2) {
          const hasX = knownSides.includes(0);
          const hasY = knownSides.includes(1);
          const hasZ = knownSides.includes(2);
          let missingSide;
          let result = null;
          if (hasX && hasY) {
            missingSide = 2;
            result = Math.hypot(arms[0], arms[1]);
          } else if (hasX && hasZ && arms[2] >= arms[0]) {
            missingSide = 1;
            result = Math.sqrt((arms[2] ** 2) - (arms[0] ** 2));
          } else if (hasY && hasZ && arms[2] >= arms[1]) {
            missingSide = 0;
            result = Math.sqrt((arms[2] ** 2) - (arms[1] ** 2));
          }
          if (missingSide !== undefined && missingSide !== triangleEditingSide &&
              triangleVisibleRows[missingSide] &&
              result !== null && Number.isFinite(result)) {
            writeArmInches(missingSide, result);
            triangleDerivedSides[missingSide] = true;
            arms[missingSide] = result;
          }
        }

        if (!areaIsTarget) {
          squareFeet = arms[0] !== null && arms[1] !== null
            ? (arms[0] * arms[1]) / 288
            : null;
          changingFromCode = true;
          setResult("sqfeet", squareFeet === null ? "" : fmt(squareFeet));
          changingFromCode = false;
        }

        squareFeet = numberOrNull(sqFeetInput.value);
        if (squareFeet === null || squareFeet < 0) {
          resultIds.forEach((id) => {
            if (id !== "sqfeet" && id !== document.activeElement?.id) setResult(id, "");
          });
          saveState();
          return;
        }

        const conversions = {
          decimal: squareFeet / 435.6,
          sqyard: squareFeet / 9,
          acre: squareFeet / 43560,
          sqmeter: squareFeet * 0.09290304,
        };
        changingFromCode = true;
        Object.entries(conversions).forEach(([id, value]) => {
          if (changedIndex !== resultIndex[id]) setResult(id, fmt(value));
        });
        changingFromCode = false;
        saveState();
      }

      function eyeIcon(isVisible) {
        return isVisible
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7c2.2 0 4.1.8 5.7 1.9M22 12s-3.6 7-10 7c-2.2 0-4.1-.8-5.7-1.9M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/></svg>'
          : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Zm7.5 0a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
      }

      function renderRows() {
        const container = document.getElementById("measurement-sections");
        container.replaceChildren();
        sections.forEach((sectionConfig, sectionIndex) => {
          const fieldStart = sectionIndex * 6;
          const section = document.createElement("div");
          section.className = "measure-section";
          section.dataset.typeLabel = sectionConfig.label;
          section.dataset.landTypes = sectionConfig.landTypes.join(",");
          const sectionLabel = document.createElement("span");
          sectionLabel.className = "measure-section-label";
          sectionLabel.textContent = sectionConfig.label;
          section.append(sectionLabel);

          sectionConfig.rows.forEach((label, position) => {
            const rowIndex = sectionIndex * 3 + position;
            const fieldIndex = fieldStart + position * 2;
            const row = document.createElement("div");
            row.className = `measure-row${visibleRows[rowIndex] ? "" : " is-hidden"}`;
            row.dataset.row = String(rowIndex);
            const text = document.createElement("span");
            text.className = "measure-label";
            text.textContent = label;
            row.append(text);
            const toggle = document.createElement("button");
            toggle.type = "button";
            toggle.className = "eye-toggle";
            toggle.setAttribute(
              "aria-label",
              `${visibleRows[rowIndex] ? "Hide" : "Show"} ${label} fields`
            );
            toggle.innerHTML = eyeIcon(visibleRows[rowIndex]);
            toggle.addEventListener("click", () => {
              if (visibleRows[rowIndex]) {
                fields[fieldIndex] = "";
                fields[fieldIndex + 1] = "";
                const first = row.querySelector(`[data-field="${fieldIndex}"]`);
                const second = row.querySelector(`[data-field="${fieldIndex + 1}"]`);
                if (first) first.value = "";
                if (second) second.value = "";
              }
              visibleRows[rowIndex] = !visibleRows[rowIndex];
              renderRows();
              updateArea();
              saveState();
            });
            row.append(toggle);
            [0, 1].forEach((offset) => {
              const input = document.createElement("input");
              input.className = "measurement-input";
              input.type = "text";
              input.inputMode = "decimal";
              input.autocomplete = "off";
              input.maxLength = 100;
              input.setAttribute("aria-label", `${label} ${offset === 0 ? "feet" : "inches"}`);
              const index = fieldIndex + offset;
              input.dataset.field = String(index);
              input.value = fields[index];
              input.addEventListener("input", () => {
                input.value = input.value.replace(/[^\d.]/g, "").replace(/^(\d*\.\d*).*$/, "$1");
                const point = input.value.indexOf(".");
                if (point >= 0) input.value = input.value.slice(0, point + 6);
                fields[index] = input.value;
                updateArea(index);
              });
              row.append(input);
            });
            section.append(row);
          });
          container.append(section);
        });
      }

      function renderTriangleRows() {
        const container = document.getElementById("triangle-sections");
        container.replaceChildren();
        const section = document.createElement("div");
        section.className = "measure-section type-hidden";
        section.dataset.typeLabel = "lnThree";
        section.dataset.landTypes = "Triangular";
        const sectionLabel = document.createElement("span");
        sectionLabel.className = "measure-section-label";
        sectionLabel.textContent = "lnThree";
        section.append(sectionLabel);

        ["Arm (X)", "Arm (Y)", "Arm (Z)"].forEach((label, side) => {
          const row = document.createElement("div");
          row.className = `measure-row${triangleVisibleRows[side] ? "" : " is-hidden"}`;
          const text = document.createElement("span");
          text.className = "measure-label";
          text.textContent = label;
          row.append(text);

          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "eye-toggle";
          toggle.setAttribute(
            "aria-label",
            `${triangleVisibleRows[side] ? "Hide" : "Show"} ${label} fields`
          );
          toggle.innerHTML = eyeIcon(triangleVisibleRows[side]);
          toggle.addEventListener("click", () => {
            if (triangleVisibleRows[side]) {
              triangleFields[side * 2] = "";
              triangleFields[side * 2 + 1] = "";
              triangleDerivedSides[side] = false;
            }
            triangleVisibleRows[side] = !triangleVisibleRows[side];
            renderTriangleRows();
            updateTriangleArea();
            saveState();
          });
          row.append(toggle);

          [0, 1].forEach((offset) => {
            const index = side * 2 + offset;
            const unit = offset === 0 ? "feet" : "inches";
            const input = document.createElement("input");
            input.className = "measurement-input";
            input.type = "text";
            input.inputMode = "decimal";
            input.autocomplete = "off";
            input.maxLength = 100;
            input.placeholder = offset === 0 ? "ft" : "in";
            input.setAttribute("aria-label", `${label} ${unit}`);
            input.dataset.armField = String(index);
            input.value = triangleFields[index];
            input.addEventListener("focus", () => {
              triangleEditingSide = side;
              if (triangleDerivedSides[side]) {
                triangleDerivedSides.forEach((isDerived, derivedSide) => {
                  if (isDerived && derivedSide !== side) {
                    triangleFields[derivedSide * 2] = "";
                    triangleFields[derivedSide * 2 + 1] = "";
                    const feetInput = document.querySelector(
                      `[data-arm-field="${derivedSide * 2}"]`
                    );
                    const inchesInput = document.querySelector(
                      `[data-arm-field="${derivedSide * 2 + 1}"]`
                    );
                    if (feetInput) feetInput.value = "";
                    if (inchesInput) inchesInput.value = "";
                  }
                  triangleDerivedSides[derivedSide] = false;
                });
              }
            });
            input.addEventListener("blur", () => {
              if (triangleEditingSide === side) triangleEditingSide = null;
              updateTriangleArea(side * 2);
            });
            input.addEventListener("input", () => {
              input.value = input.value.replace(/[^\d.]/g, "").replace(/^(\d*\.\d*).*$/, "$1");
              const point = input.value.indexOf(".");
              if (point >= 0) input.value = input.value.slice(0, point + 6);
              triangleFields[index] = input.value;
              updateTriangleArea(index);
            });
            row.append(input);
          });

          section.append(row);
        });
        container.append(section);
      }

      function renderRoundRows() {
        const container = document.getElementById("circle-sections");
        container.replaceChildren();
        const section = document.createElement("div");
        section.className = `measure-section${circleVisible ? "" : " type-hidden"}`;
        section.dataset.typeLabel = "lnFour";
        section.dataset.landTypes = "Round";
        const sectionLabel = document.createElement("span");
        sectionLabel.className = "measure-section-label";
        sectionLabel.textContent = "lnFour";
        section.append(sectionLabel);

        const row = document.createElement("div");
        row.className = `measure-row${circleVisible ? "" : " is-hidden"}`;
        const text = document.createElement("span");
        text.className = "measure-label";
        text.textContent = "Diameter (D)";
        row.append(text);

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "eye-toggle";
        toggle.setAttribute(
          "aria-label",
          `${circleVisible ? "Hide" : "Show"} Diameter fields`
        );
        toggle.innerHTML = eyeIcon(circleVisible);
        toggle.addEventListener("click", () => {
          if (circleVisible) {
            circleFields.fill("");
            areaIsTarget = false;
          }
          circleVisible = !circleVisible;
          renderRoundRows();
          updateRoundArea();
          saveState();
        });
        row.append(toggle);

        [0, 1].forEach((index) => {
          const unit = index === 0 ? "feet" : "inches";
          const input = document.createElement("input");
          input.className = "measurement-input";
          input.type = "text";
          input.inputMode = "decimal";
          input.autocomplete = "off";
          input.maxLength = 100;
          input.placeholder = index === 0 ? "ft" : "in";
          input.setAttribute("aria-label", `Diameter ${unit}`);
          input.dataset.circleField = String(index);
          input.value = circleFields[index];
          input.addEventListener("input", () => {
            input.value = input.value.replace(/[^\d.]/g, "").replace(/^(\d*\.\d*).*$/, "$1");
            const point = input.value.indexOf(".");
            if (point >= 0) input.value = input.value.slice(0, point + 6);
            circleFields[index] = input.value;
            updateRoundArea(index);
          });
          row.append(input);
        });

        section.append(row);
        container.append(section);
      }

      resultIds.forEach((id) => {
        const input = document.getElementById(id);
        input.addEventListener("input", () => {
          input.value = input.value.replace(/[^\d.]/g, "").replace(/^(\d*\.\d*).*$/, "$1");
          const point = input.value.indexOf(".");
          if (point >= 0) input.value = input.value.slice(0, point + 6);
          const index = resultIndex[id];
          if (index === 12) {
            areaIsTarget = input.value.trim() !== "" && Number(input.value) >= 0;
          } else {
            const factor = { decimal: 435.6, sqyard: 9, acre: 43560, sqmeter: 10.7639104167 }[id];
            const entered = numberOrNull(input.value);
            const sqFeet = entered !== null && entered >= 0 ? entered * factor : null;
            areaIsTarget = sqFeet !== null;
            if (sqFeet !== null) {
              changingFromCode = true;
              setResult("sqfeet", fmt(sqFeet));
              changingFromCode = false;
            }
          }
          updateArea(index);
        });
      });

      function updateTypeLabels() {
        document.querySelectorAll(".measure-section[data-type-label]").forEach((section) => {
          const isSelected = section.dataset.landTypes
            .split(",")
            .includes(selectedLandType);
          section.classList.toggle("type-hidden", !isSelected);
          section.classList.toggle("show-label", isSelected);
        });
        updateLaw();
      }

      function updateLaw() {
        const formulas = {
          Rectangular: {
            bengali: "আয়তক্ষেত্র: ক্ষেত্রফল = গড় (A, B) দৈর্ঘ্য × গড় (C, D) প্রস্থ",
            english: "Rectangle: Area = average (A, B) length × average (C, D) width",
          },
          Triangular: {
            bengali: "সমকোণী ত্রিভুজ: ক্ষেত্রফল = X × Y ÷ 2; Z² = X² + Y²; X² = Z² − Y²; Y² = Z² − X²",
            english: "Right triangle: Area = X × Y ÷ 2; Z² = X² + Y²; X² = Z² − Y²; Y² = Z² − X²",
          },
          Round: {
            bengali: "বৃত্ত: ক্ষেত্রফল = π × ব্যাস² ÷ 4; ব্যাস = √(৪ × ক্ষেত্রফল ÷ π)",
            english: "Circle: Area = π × Diameter² ÷ 4; Diameter = √(4 × Area ÷ π)",
          },
        };
        const formula = formulas[selectedLandType];
        const box = document.getElementById("law-box");
        box.classList.toggle("is-visible", Boolean(formula));
        document.getElementById("law-bengali").textContent = formula?.bengali ?? "";
        document.getElementById("law-english").textContent = formula?.english ?? "";
      }

      function clearAll() {
        fields.fill("");
        visibleRows.fill(false);
        triangleFields.fill("");
        triangleVisibleRows.fill(false);
        triangleDerivedSides.fill(false);
        triangleEditingSide = null;
        circleFields.fill("");
        circleVisible = false;
        areaIsTarget = false;
        resultIds.forEach((id) => {
          document.getElementById(id).value = "";
        });
        renderRows();
        renderTriangleRows();
        renderRoundRows();
        updateTypeLabels();
        saveState();
      }

      document.getElementById("clear").addEventListener("click", clearAll);
      document.getElementById("toolbar-clear").addEventListener("click", clearAll);
      document.getElementById("client-toggle").addEventListener("click", (event) => {
        const button = event.currentTarget;
        const fieldsElement = document.getElementById("client-fields");
        const expanded = button.getAttribute("aria-expanded") !== "true";
        button.setAttribute("aria-expanded", String(expanded));
        fieldsElement.hidden = !expanded;
        document.getElementById("client-toggle-icon").textContent = expanded ? "−" : "+";
      });
      document.querySelectorAll(".client-input").forEach((input) => {
        input.addEventListener("input", saveState);
      });
      document.getElementById("save").addEventListener("click", saveLandRecordToGitHub);
      document.querySelectorAll(".type-button").forEach((button) => {
        button.addEventListener("click", () => {
          selectedLandType =
            selectedLandType === button.textContent ? "" : button.textContent;
          document.querySelectorAll(".type-button").forEach((item) => {
            item.setAttribute("aria-pressed", String(item.textContent === selectedLandType));
          });
          updateTypeLabels();
          updateArea();
          saveState();
        });
      });

      loadState();
      document.getElementById("lnID").value = clientFields.enID;
      document.getElementById("lnTrack").value = clientFields.enTrack;
      document.getElementById("lnDetail").value = clientFields.lnDetail;
      document.getElementById("lnMobile").value = clientFields.lnMobile;
      document.getElementById("lnCode").value = clientFields.lnCode;
      document.querySelectorAll(".type-button").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.textContent === selectedLandType));
      });
      renderRows();
      renderTriangleRows();
      renderRoundRows();
      updateTypeLabels();
      updateArea(-1);

      window.addEventListener(
        "scroll",
        () => {
          window.clearTimeout(scrollSaveTimer);
          scrollSaveTimer = window.setTimeout(saveState, 150);
        },
        { passive: true }
      );
      window.addEventListener("pagehide", () => {
        window.clearTimeout(scrollSaveTimer);
        saveState();
      });
      requestAnimationFrame(() => window.scrollTo(0, savedScrollY));
    </script>
  </body>
</html>
